<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuaca Jakarta – Ionic App</title>

    <!-- Ionic CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />

    <!-- Ionic Core JS (ESM) -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Design Tokens ───────────────────────────────────── */
      :root {
        --bg:        #0b0f1a;
        --surface:   #131929;
        --card:      #1a2235;
        --border:    #243050;
        --accent:    #38bdf8;
        --accent2:   #818cf8;
        --hot:       #fb923c;
        --warm:      #facc15;
        --cool:      #38bdf8;
        --cold:      #a78bfa;
        --text:      #e2e8f0;
        --muted:     #64748b;
        --font-body: 'Sora', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      /* ── Reset ───────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Ionic overrides ─────────────────────────────────── */
      ion-app       { background: var(--bg); }
      ion-content   { --background: var(--bg); }
      ion-toolbar   { --background: var(--surface); --border-color: var(--border); }
      ion-title     { font-family: var(--font-body); font-weight: 700; color: var(--text); }

      /* ── Header ──────────────────────────────────────────── */
      .header-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
      }
      .header-icon { font-size: 1.6rem; }
      .header-sub  { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

      /* ── Hero card ───────────────────────────────────────── */
      .hero {
        margin: 20px 16px 0;
        padding: 24px 20px;
        background: linear-gradient(135deg, #162340 0%, #0f1e38 100%);
        border: 1px solid var(--border);
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: '';
        position: absolute;
        top: -40px; right: -40px;
        width: 160px; height: 160px;
        background: radial-gradient(circle, rgba(56,189,248,.18) 0%, transparent 70%);
        pointer-events: none;
      }
      .hero-emoji { font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 0 18px rgba(56,189,248,.4)); }
      .hero-info  { flex: 1; }
      .hero-city  { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
      .hero-temp  { font-size: 2.8rem; font-weight: 700; color: var(--accent); line-height: 1; }
      .hero-temp span { font-size: 1.2rem; font-weight: 300; }
      .hero-label { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
      .hero-time  {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--accent2);
        background: rgba(129,140,248,.12);
        border: 1px solid rgba(129,140,248,.25);
        padding: 4px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }

      /* ── Section label ───────────────────────────────────── */
      .section-label {
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 20px 16px 10px;
      }

      /* ── Table card ──────────────────────────────────────── */
      .table-card {
        margin: 0 16px 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }

      thead th {
        background: var(--surface);
        padding: 12px 16px;
        text-align: left;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 1px solid var(--border);
      }
      thead th:last-child { text-align: right; }

      tbody tr {
        border-bottom: 1px solid rgba(36,48,80,.6);
        transition: background .15s;
      }
      tbody tr:last-child { border-bottom: none; }
      tbody tr:hover      { background: rgba(56,189,248,.05); }
      tbody tr.current-row { background: rgba(56,189,248,.1); }

      tbody td {
        padding: 11px 16px;
        vertical-align: middle;
      }
      tbody td:last-child { text-align: right; }

      /* time cell */
      .td-time {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .td-date {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
      }
      .td-hour {
        font-family: var(--font-mono);
        font-size: 0.88rem;
        color: var(--text);
        font-weight: 500;
      }
      .badge-now {
        display: inline-block;
        font-size: 0.6rem;
        background: var(--accent);
        color: #0b0f1a;
        padding: 1px 6px;
        border-radius: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-left: 6px;
        vertical-align: middle;
      }

      /* temp chip */
      .temp-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.92rem;
        border: 1px solid transparent;
      }
      .temp-chip .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
      }

      /* ── Loading / Error ─────────────────────────────────── */
      .state-box {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .state-box .icon { font-size: 2.8rem; margin-bottom: 12px; }
      .state-box p     { font-size: 0.9rem; }
      .spin { animation: spin 1s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Footer ──────────────────────────────────────────── */
      .footer {
        text-align: center;
        padding: 12px;
        font-size: 0.7rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
      .footer a { color: var(--accent2); text-decoration: none; }

      /* ── Fade-in rows ────────────────────────────────────── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-row {
        animation: fadeUp .3s ease both;
      }
    </style>
  </head>
  <body>
    <ion-app>
      <ion-header translucent="true">
        <ion-toolbar>
          <ion-title>
            <div class="header-inner">
              <span class="header-icon">🌤️</span>
              <div>
                <div>Cuaca Jakarta</div>
                <div class="header-sub">Prakiraan Per Jam</div>
              </div>
            </div>
          </ion-title>
          <ion-buttons slot="end">
            <ion-button id="refresh-btn" title="Refresh data">
              <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content fullscreen>

        <!-- Hero card -->
        <div class="hero" id="hero" style="display:none">
          <div class="hero-emoji" id="hero-emoji">🌡️</div>
          <div class="hero-info">
            <div class="hero-city">Jakarta, Indonesia</div>
            <div class="hero-temp" id="hero-temp">--<span>°C</span></div>
            <div class="hero-label">Suhu saat ini</div>
          </div>
          <div class="hero-time" id="hero-time">--:--</div>
        </div>

        <!-- Section label -->
        <div class="section-label">📋 Data Prakiraan 7 Hari (Per Jam)</div>

        <!-- Table card -->
        <div class="table-card">
          <div id="state-loading" class="state-box">
            <div class="icon"><span class="spin">⟳</span></div>
            <p>Mengambil data cuaca dari Open-Meteo…</p>
          </div>
          <div id="state-error" class="state-box" style="display:none">
            <div class="icon">⚠️</div>
            <p id="error-msg">Gagal mengambil data.</p>
          </div>
          <table id="weather-table" style="display:none">
            <thead>
              <tr>
                <th>#</th>
                <th>Waktu (Time)</th>
                <th>Suhu (°C)</th>
              </tr>
            </thead>
            <tbody id="weather-body"></tbody>
          </table>
        </div>

        <!-- Footer -->
        <div class="footer">
          Sumber data: <a href="https://open-meteo.com" target="_blank">open-meteo.com</a>
          &nbsp;·&nbsp; Koordinat: −6.2°, 106.8°
        </div>

      </ion-content>
    </ion-app>

    <script>
      const API_URL =
        'https://api.open-meteo.com/v1/forecast' +
        '?latitude=-6.2&longitude=106.8&hourly=temperature_2m';

      /* ── Helpers ─────────────────────────────────────────── */
      function tempColor(t) {
        if (t >= 35) return { bg: 'rgba(251,146,60,.15)', border: 'rgba(251,146,60,.4)', dot: '#fb923c', text: '#fb923c' };
        if (t >= 30) return { bg: 'rgba(250,204,21,.12)', border: 'rgba(250,204,21,.35)', dot: '#facc15', text: '#facc15' };
        if (t >= 24) return { bg: 'rgba(56,189,248,.12)',  border: 'rgba(56,189,248,.35)',  dot: '#38bdf8', text: '#38bdf8' };
        return           { bg: 'rgba(167,139,250,.12)', border: 'rgba(167,139,250,.35)', dot: '#a78bfa', text: '#a78bfa' };
      }

      function tempEmoji(t) {
        if (t >= 35) return '🔥';
        if (t >= 30) return '☀️';
        if (t >= 24) return '⛅';
        return '🌧️';
      }

      function formatTime(iso) {
        // iso: "2025-05-17T14:00"
        const d = new Date(iso);
        const date = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        const time = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
        return { date, time };
      }

      /* ── Nearest current hour index ──────────────────────── */
      function nearestIndex(times) {
        const now = new Date();
        let best = 0, bestDiff = Infinity;
        times.forEach((iso, i) => {
          const diff = Math.abs(new Date(iso) - now);
          if (diff < bestDiff) { bestDiff = diff; best = i; }
        });
        return best;
      }

      /* ── Render ──────────────────────────────────────────── */
      function render(data) {
        const times = data.hourly.time;
        const temps  = data.hourly.temperature_2m;
        const ci     = nearestIndex(times);

        // Hero
        const heroEl   = document.getElementById('hero');
        const { date: hDate, time: hTime } = formatTime(times[ci]);
        document.getElementById('hero-temp').innerHTML = `${temps[ci].toFixed(1)}<span>°C</span>`;
        document.getElementById('hero-emoji').textContent = tempEmoji(temps[ci]);
        document.getElementById('hero-time').textContent  = `${hDate} · ${hTime}`;
        heroEl.style.display = 'flex';

        // Table
        const tbody = document.getElementById('weather-body');
        tbody.innerHTML = '';

        times.forEach((iso, i) => {
          const { date, time } = formatTime(iso);
          const t   = temps[i];
          const c   = tempColor(t);
          const isCurrent = i === ci;

          const tr = document.createElement('tr');
          tr.className = 'fade-row' + (isCurrent ? ' current-row' : '');
          tr.style.animationDelay = `${Math.min(i, 30) * 8}ms`;

          tr.innerHTML = `
            <td style="color:var(--muted);font-family:var(--font-mono);font-size:.72rem;">${i + 1}</td>
            <td>
              <div class="td-time">
                <div class="td-date">${date}</div>
                <div class="td-hour">${time}${isCurrent ? '<span class="badge-now">Sekarang</span>' : ''}</div>
              </div>
            </td>
            <td>
              <span class="temp-chip"
                style="background:${c.bg};border-color:${c.border};color:${c.text};">
                <span class="dot" style="background:${c.dot};"></span>
                ${t.toFixed(1)} °C
              </span>
            </td>`;
          tbody.appendChild(tr);
        });

        // Show table, hide loader
        document.getElementById('state-loading').style.display = 'none';
        document.getElementById('weather-table').style.display  = 'table';

        // Scroll to current row
        setTimeout(() => {
          const rows = tbody.querySelectorAll('tr');
          if (rows[ci]) rows[ci].scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 400);
      }

      /* ── Fetch ───────────────────────────────────────────── */
      async function fetchWeather() {
        // Reset UI
        document.getElementById('state-loading').style.display = 'block';
        document.getElementById('state-error').style.display   = 'none';
        document.getElementById('weather-table').style.display  = 'none';
        document.getElementById('hero').style.display           = 'none';

        try {
          const res  = await fetch(API_URL);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          render(data);
        } catch (err) {
          document.getElementById('state-loading').style.display = 'none';
          document.getElementById('state-error').style.display   = 'block';
          document.getElementById('error-msg').textContent =
            `Gagal mengambil data: ${err.message}`;
        }
      }

      /* ── Refresh button ──────────────────────────────────── */
      document.getElementById('refresh-btn').addEventListener('click', fetchWeather);

      /* ── Init ────────────────────────────────────────────── */
      fetchWeather();
    </script>
  </body>
</html>
